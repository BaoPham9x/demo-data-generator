module:
  identifier: "visitors"
  schema: "steep_demo_fintech"
  table: "fact_visitors"
  label: "Fact Visitors"
  description: "Daily aggregated website visitor metrics for conversion analysis. Can be joined to fact_ad_spend for ROI analysis."
  dimensions:
    - column: "network"
      type: "categorical"
      label: "Network"
    - column: "channel"
      type: "categorical"
      label: "Channel"
    - column: "country"
      type: "country"
      label: "Country"
  metrics:
    - identifier: "total_visitors"
      name: "Total Visitors"
      time: "fact_visitors.visitor_date"
      description: "Total number of unique visitors."
      calculation: "sum"
      value: "fact_visitors.total_visitors"
      category: "Marketing"
      slices:
        - name: "Google"
          filter:
            column: "network"
            operator: "equals"
            expression: "google"
        - name: "Meta"
          filter:
            column: "network"
            operator: "equals"
            expression: "meta"
        - name: "Organic"
          filter:
            column: "network"
            operator: "equals"
            expression: "organic"
      dimensions:
        - "network"
        - "channel"
        - "country"
    - identifier: "total_sessions"
      name: "Total Sessions"
      time: "fact_visitors.visitor_date"
      description: "Total number of visitor sessions."
      calculation: "sum"
      value: "fact_visitors.total_sessions"
      category: "Marketing"
      dimensions:
        - "network"
        - "channel"
        - "country"
    - identifier: "total_conversions"
      name: "Total Conversions"
      time: "fact_visitors.visitor_date"
      description: "Total number of visitors who converted to registered customers."
      calculation: "sum"
      value: "fact_visitors.total_conversions"
      category: "Marketing"
      dimensions:
        - "network"
        - "channel"
        - "country"
    - identifier: "conversion_rate"
      name: "Conversion Rate"
      time: "fact_visitors.visitor_date"
      description: "Percentage of visitors who converted to registered customers."
      calculation: "custom-ratio"
      numerator_sql: "SUM(fact_visitors.total_conversions)"
      denominator_sql: "SUM(fact_visitors.total_visitors)"
      category: "Marketing"
      dimensions:
        - "network"
        - "channel"
        - "country"
    - identifier: "total_page_views"
      name: "Total Page Views"
      time: "fact_visitors.visitor_date"
      description: "Total number of pages viewed across all sessions."
      calculation: "sum"
      value: "fact_visitors.total_page_views"
      category: "Marketing"
      dimensions:
        - "network"
        - "channel"
        - "country"
    - identifier: "avg_page_views_per_session"
      name: "Avg Page Views per Session"
      time: "fact_visitors.visitor_date"
      description: "Average number of pages viewed per session."
      calculation: "custom-ratio"
      numerator_sql: "SUM(fact_visitors.total_page_views)"
      denominator_sql: "SUM(fact_visitors.total_sessions)"
      category: "Marketing"
      dimensions:
        - "network"
        - "channel"
        - "country"
    - identifier: "avg_time_on_site"
      name: "Avg Time on Site"
      time: "fact_visitors.visitor_date"
      description: "Average time spent on site per session (in seconds)."
      calculation: "custom-value"
      sql_expression: "AVG(fact_visitors.avg_time_on_site_seconds)"
      category: "Marketing"
      dimensions:
        - "network"
        - "channel"
        - "country"