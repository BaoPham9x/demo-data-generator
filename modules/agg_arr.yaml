module:
  identifier: "agg_arr"
  schema: "steep_demo_fintech"
  table: "fact_agg_arr"
  label: "Aggregated ARR"
  description: "Monthly snapshots of Annual Recurring Revenue (ARR) per subscription. This fact table provides time-series data showing ARR contributions for each active subscription at the end of each month."
  dimensions:
    - column: "plan_name"
      type: "categorical"
      label: "Plan Name"
    - column: "status"
      type: "categorical"
      label: "Status"
    - column: "billing_cycle"
      type: "categorical"
      label: "Billing Cycle"
    - column: "currency"
      type: "categorical"
      label: "Currency"
  metrics:
    - identifier: "total_arr"
      name: "Total ARR"
      time: "fact_agg_arr.snapshot_date"
      description: "Total Annual Recurring Revenue across all active subscriptions for the month. This is the sum of all subscription ARR contributions in the snapshot period."
      calculation: "sum"
      value: "fact_agg_arr.arr_contribution"
      category: "Commercial"
      dimensions:
        - "plan_name"
        - "status"
        - "billing_cycle"
        - "currency"
        - "dim_customer.customer_tier"
        - "dim_customer.country"
    - identifier: "mrr"
      name: "Monthly Recurring Revenue (MRR)"
      time: "fact_agg_arr.snapshot_date"
      description: "Total Monthly Recurring Revenue across all active subscriptions. MRR is calculated as ARR divided by 12, representing the monthly revenue from subscriptions."
      calculation: "sum"
      value: "fact_agg_arr.mrr"
      category: "Commercial"
      dimensions:
        - "plan_name"
        - "status"
        - "billing_cycle"
        - "currency"
        - "dim_customer.customer_tier"
    - identifier: "active_subscriptions"
      name: "Active Subscriptions"
      time: "fact_agg_arr.snapshot_date"
      description: "Count of active subscriptions in the monthly snapshot. This shows how many subscriptions are contributing to ARR each month."
      calculation: "count"
      category: "Commercial"
      dimensions:
        - "plan_name"
        - "status"
        - "billing_cycle"
        - "currency"
        - "dim_customer.customer_tier"
    - identifier: "avg_arr_per_subscription"
      name: "Avg ARR per Subscription"
      time: "fact_agg_arr.snapshot_date"
      description: "Average ARR contribution per active subscription. This helps understand the typical value of each subscription and can indicate if you're attracting higher-value customers over time."
      calculation: "custom-ratio"
      numerator_sql: "SUM(fact_agg_arr.arr_contribution)"
      denominator_sql: "COUNT(DISTINCT fact_agg_arr.subscription_id)"
      category: "Commercial"
      dimensions:
        - "plan_name"
        - "billing_cycle"
        - "currency"
  joinPaths:
    - from:
        column: "customer_key"
      to:
        table: "dim_customer"
        column: "customer_key"
      type: "many-to-one"
    - from:
        column: "snapshot_date"
      to:
        table: "dim_date"
        column: "date"
      type: "many-to-one"
