module:
  identifier: "ad_spend"
  schema: "steep_demo_fintech"
  table: "fact_ad_spend"
  label: "Fact Ad spend"
  description: ""
  dimensions:
    - column: "channel"
      type: "categorical"
      label: "Channel"
    - column: "network"
      type: "categorical"
      label: "Network"
    - column: "country"
      type: "country"
      label: "Country"
  metrics:
    - identifier: "ad_spend"
      name: "Ad spend"
      time: "fact_ad_spend.created_at"
      description: "Total amount of money spent on advertising across all marketing channels (Google, Meta, YouTube, etc.). This is our marketing budget metric showing where our advertising dollars are going."
      calculation: "sum"
      value: "fact_ad_spend.amount"
      category: "Marketing"
      dimensions:
        - "country"
        - "network"
        - "channel"
    - identifier: "avg_ad_spend_per_day"
      name: "Avg Ad Spend per Day"
      time: "fact_ad_spend.created_at"
      description: "Average amount spent on advertising per day. This helps us understand our daily marketing budget and spending patterns."
      calculation: "custom-value"
      sql_expression: "AVG(fact_ad_spend.amount)"
      category: "Marketing"
      dimensions:
        - "network"
        - "channel"
    - identifier: "ad_conversion_rate"
      name: "Ad Conversion Rate"
      time: "fact_ad_spend.created_at"
      description: "The percentage of ad spend that resulted in customer conversions. This metric shows how efficiently our advertising budget is generating new customers. Higher is better."
      calculation: "custom-ratio"
      numerator_sql: "SUM(fact_ad_spend.conversions)"
      denominator_sql: "SUM(fact_ad_spend.amount)"
      format: "percentage"
      category: "Marketing"
      dimensions:
        - "network"
        - "channel"
        - "country"
    - identifier: "cpa"
      name: "Cost per Acquisition (CPA)"
      time: "fact_ad_spend.created_at"
      description: "The average cost to acquire one new customer through advertising. This is calculated as total ad spend divided by total conversions. Lower CPA means more efficient customer acquisition."
      calculation: "custom-ratio"
      numerator_sql: "SUM(fact_ad_spend.amount)"
      denominator_sql: "SUM(fact_ad_spend.conversions)"
      format: "number"
      category: "Marketing"
      dimensions:
        - "network"
        - "channel"
        - "country"
    - identifier: "ad_conversions"
      name: "Ad Conversions"
      time: "fact_ad_spend.created_at"
      description: "Total count of new customer signups that can be attributed to our advertising campaigns. This shows how many customers our ads are bringing in."
      calculation: "sum"
      value: "fact_ad_spend.conversions"
      category: "Marketing"
      dimensions:
        - "network"
        - "channel"
        - "country"
  joinPaths:
    - from:
        column: "visitor_key"
      to:
        table: "fact_visitors"
        column: "visitor_key"
      type: "many-to-one"
      description: "Multiple ad spend rows can join to one aggregated visitor row per day/network/channel/country/campaign"