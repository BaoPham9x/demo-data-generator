module:
  identifier: "customers"
  schema: "steep_demo_v2"
  table: "dim_customer"
  label: "Dim Customer"
  description: ""
  dimensions:
    - column: "email"
      type: "categorical"
      label: "Email"
    - column: "city"
      type: "city"
      label: "City"
    - column: "region"
      type: "categorical"
      label: "Region"
    - column: "customer_tier"
      type: "categorical"
      label: "Customer Tier"
    - column: "registration_source"
      type: "categorical"
      label: "Registration Source"
    - column: "kyb_status"
      type: "categorical"
      label: "KYB Status"
    - column: "account_status"
      type: "categorical"
      label: "Account Status"
    - column: "country"
      type: "country"
      label: "Country"
    - column: "first_name"
      type: "categorical"
      label: "First name"
    - column: "last_name"
      type: "categorical"
      label: "Last name"
    - column: "timezone"
      type: "categorical"
      label: "Timezone"
  metrics:
    - identifier: "activated_customers"
      name: "Activated Customers"
      time: "dim_customer.created_at"
      description: "Count of customers who have completed at least one transaction. This indicates how many customers have moved beyond just signing up and are actively using the platform."
      calculation: "count"
      owner_emails:
        - "deanne@steep.app"
      filters:
        - column: "is_activated"
          operator: "equals"
          expression: "1"
      category: "Commercial"
      dimensions:
        - "first_name"
        - "last_name"
        - "account_status"
        - "kyb_status"
        - "email"
        - "city"
        - "region"
        - "country"
        - "customer_tier"
        - "registration_source"
    - identifier: "activation_rate"
      name: "Activation Rate"
      time: "dim_customer.created_at"
      description: "The percentage of registered customers who have made their first transaction. A higher activation rate means more customers are successfully onboarding and using our service."
      calculation: "custom-ratio"
      numerator_sql: "SUM(CASE WHEN dim_customer.is_activated = 1 THEN 1 END)"
      denominator_sql: "COUNT(*)"
      format: "percentage"
      owner_emails:
        - "deanne@steep.app"
      category: "Commercial"
      dimensions:
        - "last_name"
        - "email"
        - "region"
        - "city"
        - "kyb_status"
        - "account_status"
        - "timezone"
        - "country"
        - "customer_tier"
        - "registration_source"
    - identifier: "avg_kyb_completion_days"
      name: "Avg KYC Completion Days"
      time: "dim_customer.created_at"
      description: "Average number of days it takes for customers to complete the Know Your Customer (KYC) verification process from start to approval. Lower is better - indicates a smoother onboarding experience."
      calculation: "custom-value"
      sql_expression: "AVG(dim_customer.kyb_completion_days)"
      owner_emails:
        - "deanne@steep.app"
      category: "Operations"
      dimensions:
        - "country"
        - "customer_tier"
    - identifier: "avg_time_to_activation"
      name: "Avg Time to Activation (Days)"
      time: "dim_customer.created_at"
      description: "Average number of days between when a customer signs up and when they make their first transaction. This measures how quickly new customers start using our service."
      calculation: "custom-value"
      sql_expression: "AVG(dim_customer.time_to_activation_days)"
      owner_emails:
        - "deanne@steep.app"
      category: "Operations"
      dimensions:
        - "country"
        - "customer_tier"
    - identifier: "total_customers"
      name: "Customer Acquisition"
      time: "dim_customer.created_at"
      description: "Total number of new customers created in the system during a given period. This metric helps track growth and evaluate the effectiveness of acquisition strategies over time."
      calculation: "count"
      slices:
        - name: "Main Countries"
          filter:
            column: "country"
            operator: "in"
            expression: "US,GB,SE"
        - name: "Europe"
          filter:
            column: "region"
            operator: "equals"
            expression: "Europe"
      category: "Commercial"
      dimensions:
        - "account_status"
        - "timezone"
        - "email"
        - "country"
        - "city"
        - "region"
        - "customer_tier"
        - "registration_source"
        - "kyb_status"
    - identifier: "kyc_approved"
      name: "KYC Approved %"
      time: "dim_customer.created_at"
      description: "The percentage of customers who successfully completed and were approved through the Know Your Customer (KYC) verification process. This measures the success rate of our identity verification workflow."
      calculation: "custom-ratio"
      numerator_sql: "SUM(CASE WHEN dim_customer.kyb_status = 'approved' THEN 1 END)"
      denominator_sql: "COUNT(*)"
      format: "percentage"
      category: "Operations"
      dimensions:
        - "country"
        - "customer_tier"
        - "registration_source"
    - identifier: "registrations"
      name: "Registrations"
      time: "dim_customer.created_at"
      description: "Total count of new user sign-ups or account registrations. This is our top-of-funnel metric showing how many people are creating accounts."
      calculation: "count"
      category: "Marketing"
      dimensions:
        - "registration_source"
        - "customer_tier"
        - "account_status"
        - "country"
        - "email"
  joinPaths:
    - from:
        column: "customer_key"
      to:
        table: "dim_account"
        column: "customer_id"
      type: "one-to-many"
    - from:
        column: "customer_key"
      to:
        table: "fact_customer_features"
        column: "customer_key"
      type: "one-to-many"
    - from:
        column: "customer_key"
      to:
        table: "fact_risk_events"
        column: "customer_key"
      type: "one-to-many"
    - from:
        column: "customer_key"
      to:
        table: "fact_subscriptions"
        column: "customer_key"
      type: "one-to-many"
    - from:
        column: "customer_key"
      to:
        table: "fact_transactions"
        column: "customer_key"
      type: "one-to-many"
    - from:
        column: "customer_key"
      to:
        table: "fact_agg_arr"
        column: "customer_key"
      type: "one-to-many"
