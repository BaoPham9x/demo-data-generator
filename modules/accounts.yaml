module:
  identifier: "accounts"
  schema: "steep_demo_fintech"
  table: "dim_account"
  label: "Dim Accounts"
  description: ""
  dimensions:
    - column: "account_type"
      type: "categorical"
      label: "Account Type"
    - column: "account_status"
      type: "categorical"
      label: "Account Status"
    - column: "currency"
      type: "categorical"
      label: "Currency"
  metrics:
    - identifier: "avg_credit_limit"
      name: "Avg Credit Limit"
      time: "dim_account.created_at"
      description: "The average credit limit assigned to accounts. This shows typical credit limits and helps understand your credit risk exposure and customer creditworthiness."
      calculation: "custom-value"
      sql_expression: "AVG(dim_account.credit_limit)"
      category: "Operations"
      dimensions:
        - "account_type"
        - "currency"
  joinPaths:
    - from:
        column: "account_id"
      to:
        table: "fact_transactions"
        column: "account_key"
      type: "one-to-many"
    - from:
        column: "account_key"
      to:
        table: "fact_balances"
        column: "account_key"
      type: "one-to-many"
