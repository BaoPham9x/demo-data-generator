module:
  identifier: "accounts"
  schema: "steep_demo_v2"
  table: "dim_account"
  label: "Dim Accounts"
  description: ""
  dimensions:
    - column: "account_type"
      type: "categorical"
      label: "Account Type"
    - column: "account_status"
      type: "categorical"
      label: "Account Status"
    - column: "currency"
      type: "categorical"
      label: "Currency- test Ooono"
  metrics:
    - identifier: "avg_credit_limit"
      name: "Avg Credit Limit"
      time: "dim_account.created_at"
      description: "The average credit limit assigned to accounts. This shows typical credit limits and helps us understand our credit risk exposure and customer creditworthiness."
      calculation: "custom-value"
      sql_expression: "AVG(dim_account.credit_limit)"
      owner_emails:
        - "deanne@steep.app"
      category: "Operations"
      dimensions:
        - "dim_customer.city"
        - "account_type"
        - "currency"
  joinPaths:
    - from:
        column: "account_id"
      to:
        table: "fact_transactions"
        column: "account_key"
      type: "one-to-many"
