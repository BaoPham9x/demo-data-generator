module:
  identifier: "transactions"
  schema: "steep_demo_fintech"
  table: "fact_transactions"
  dimensions:
    - column: "currency"
      type: "categorical"
      label: "Currency"
    - column: "country"
      type: "country"
      label: "Country"
    - column: "transaction_type"
      type: "categorical"
      label: "Transaction Type"
    - column: "status"
      type: "categorical"
      label: "Status"
    - column: "merchant_category"
      type: "categorical"
      label: "Merchant Category"
    - column: "payment_method"
      type: "categorical"
      label: "Payment Method"
    - column: "risk_flag"
      type: "categorical"
      label: "Risk Flag"
    - column: "customer_key"
      type: "categorical"
      label: "Customer key"
    - column: "account_key"
      type: "categorical"
      label: "Account key"
    - column: "customer_id"
      type: "categorical"
      label: "Customer id"
    - column: "city"
      type: "categorical"
      label: "City"
    - column: "merchant_key"
      type: "categorical"
      label: "Merchant key"
    - column: "merchant_name"
      type: "categorical"
      label: "Merchant name"
  metrics:
    - identifier: "avg_transaction_amount"
      name: "Avg Transaction Amount"
      time: "fact_transactions.created_at"
      description: "The average dollar amount per completed transaction. This helps us understand typical transaction sizes and customer spending patterns."
      calculation: "custom-ratio"
      numerator_sql: "SUM(fact_transactions.amount)"
      denominator_sql: "COUNT(*)"
      format: "number"
      filters:
        - column: "status"
          operator: "equals"
          expression: "completed"
      category: "Operations"
      dimensions:
        - "country"
        - "currency"
        - "transaction_type"
        - "merchant_category"
        - "dim_customer.customer_tier"
        - "dim_customer.email"
    - identifier: "completed_transactions"
      name: "Completed Transactions"
      time: "fact_transactions.created_at"
      description: "Count of transactions that were successfully processed and completed. This is our primary success metric for payment processing."
      calculation: "count"
      filters:
        - column: "status"
          operator: "equals"
          expression: "completed"
      category: "Operations"
      dimensions:
        - "country"
        - "transaction_type"
        - "dim_customer.customer_tier"
    - identifier: "failed_transactions"
      name: "Failed Transactions"
      time: "fact_transactions.created_at"
      description: "Count of transactions that failed to process. Monitor this to identify payment issues, declined cards, or system problems affecting customer experience."
      calculation: "count"
      filters:
        - column: "status"
          operator: "equals"
          expression: "failed"
      category: "Operations"
      dimensions:
        - "country"
        - "transaction_type"
    - identifier: "high_risk_transactions"
      name: "High Risk Transactions"
      time: "fact_transactions.created_at"
      description: "Count of transactions flagged by our risk system as potentially fraudulent, suspicious, or requiring additional review. Higher numbers may indicate fraud attempts or overly strict risk rules."
      calculation: "count"
      filters:
        - column: "risk_flag"
          operator: "in"
          expression: "high_risk,suspicious,aml_review"
      category: "Operations"
      dimensions:
        - "country"
        - "transaction_type"
        - "dim_customer.customer_tier"
    - identifier: "revenue"
      name: "Revenue"
      time: "fact_transactions.created_at"
      description: "Total revenue from all completed transactions, including transaction amounts and fees. This is our primary revenue metric showing money flowing through the platform."
      calculation: "sum"
      value: "fact_transactions.amount"
      filters:
        - column: "status"
          operator: "equals"
          expression: "completed"
      slices:
        - name: "3.SE"
          filter:
            column: "country"
            operator: "equals"
            expression: "SE"
        - name: "2.CA"
          filter:
            column: "country"
            operator: "equals"
            expression: "CA"
      category: "Commercial"
      dimensions:
        - "customer_id"
        - "country"
        - "currency"
    - identifier: "transaction_count"
      name: "Transaction Count"
      time: "fact_transactions.created_at"
      description: "Total count of all transactions regardless of status. This shows overall transaction volume and activity on our platform."
      calculation: "count"
      category: "Operations"
      dimensions:
        - "dim_account.account_type"
        - "payment_method"
        - "country"
        - "currency"
        - "status"
        - "transaction_type"
        - "dim_customer.customer_tier"
    - identifier: "success_rate"
      name: "Transaction Success Rate"
      time: "fact_transactions.created_at"
      description: "The percentage of transactions that completed successfully. A high success rate (95%+) indicates reliable payment processing. Lower rates may signal technical issues or payment method problems."
      calculation: "custom-ratio"
      numerator_sql: "SUM(CASE WHEN fact_transactions.status = 'completed' THEN 1 END)"
      denominator_sql: "COUNT(*)"
      format: "percentage"
      category: "Operations"
      dimensions:
        - "country"
        - "transaction_type"
        - "payment_method"
    - identifier: "transaction_volume"
      name: "Transaction Volume (TPV)"
      time: "fact_transactions.created_at"
      description: "Total Payment Volume (TPV) - the total dollar amount of all completed transactions. This includes card payments, transfers, deposits, and withdrawals. TPV is critical because our revenue is typically a percentage of this volume."
      calculation: "sum"
      value: "fact_transactions.amount"
      owner_emails:
        - "deanne@steep.app"
      filters:
        - column: "status"
          operator: "equals"
          expression: "completed"
      slices:
        - name: "US"
          filter:
            column: "country"
            operator: "equals"
            expression: "US"
        - name: "Card Spend Only"
          filter:
            column: "transaction_type"
            operator: "equals"
            expression: "card_spend"
      category: "Commercial"
      dimensions:
        - "merchant_name"
        - "status"
        - "dim_customer.registration_source"
        - "country"
        - "currency"
        - "transaction_type"
        - "merchant_category"
        - "payment_method"
        - "dim_customer.customer_tier"
        - "dim_customer.email"
